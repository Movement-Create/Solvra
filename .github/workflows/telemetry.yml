name: Telemetry and installers
on:
  push:
    branches: [feat/public-telemetry, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Solvra.Tests --filter FullyQualifiedName~TelemetryTests --nologo
      - run: dotnet run --project src/Solvra -- telemetry --help
      - name: Windows installer helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/test-install.ps1 ./scripts/windows/install.ps1
      - name: Native worker definition
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./scripts/test-telemetry-worker.ps1
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/telemetry/requirements.txt
      - run: pytest tools/telemetry -q
