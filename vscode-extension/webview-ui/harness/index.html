<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/media/v3/main.css"><title>Solvra harness</title>
<script type="module">
  import { THEMES } from './themes.js';
  import { SCENARIOS } from './scenarios.js';
  const q = new URLSearchParams(location.search);
  const theme = THEMES[q.get('theme') || 'light'];
  document.body.classList.add(theme.cls);
  // Like VS Code: theme variables on <html>, theme class on <body>.
  for (const [k, v] of Object.entries(theme.vars)) document.documentElement.style.setProperty(k, v);
  document.body.dataset.surface = q.get('surface') || 'sidebar';
  window.__sent = [];
  window.__solvraHost = (m) => {
    window.__sent.push(m);
    if (m.type === 'ready') for (const msg of SCENARIOS[q.get('s') || 'empty']) window.postMessage(msg, '*');
  };
</script>
<style>body { font-size: 13px; }</style></head>
<body><div id="root"></div><script type="module" src="/media/v3/main.js"></script></body></html>
